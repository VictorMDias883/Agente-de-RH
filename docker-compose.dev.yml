services:
  backend:
    build:
      context: ./Backend
    container_name: ${COMPOSE_PROJECT_NAME:-hr}_backend
    restart: always

    ports:
      - "${BACKEND_PORT:-8000}:8000"

    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://postgres:${DATABASE_PASSWORD:-postgres}@${DATABASE_HOST:-192.168.15.4}:${DATABASE_PORT:-5432}/${DATABASE_NAME:-hrsystem}}
      DATABASE_HOST: ${DATABASE_HOST:-192.168.15.4}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-hrsystem}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}

    volumes:
      - ./Backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-hr}_frontend
    restart: always

    ports:
      - "${FRONTEND_PORT:-3000}:3000"

    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next