services:
  postgres:
    image: postgres:18
    container_name: hr_postgres
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hrsystem

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    build: ./backend
    container_name: hr_backend
    restart: always

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hrsystem

    volumes:
      - ./backend:/app
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  frontend:
    build: ./frontend
    container_name: hr_frontend
    restart: always

    ports:
      - "3000:3000"

    depends_on:
      - backend

    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
volumes:
  postgres_data: