version: "3.9"

services:
  postgres:
    image: postgres:18
    container_name: hr_postgres
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hrsystem
    ports: -"5432:5432"
    volumes: -postgres_data:/var/liv/postgresql/data

volumes:
  postgres_data:
