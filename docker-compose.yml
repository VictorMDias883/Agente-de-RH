version: "3.9"

services:
  postgres:
    image: postgres:18

    container_name: hr_postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hrsystem

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    build: .
    container_name: hr_backend
    restart: always

    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      - DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hrsystem
    volumes:
      - .:/app
volumes:
  postgres_data:
