services:
  postgres:
    image: postgres:18
    container_name: hr_postgres
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hrsystem

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    build: ./backend
    container_name: hr_backend
    restart: always

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/hrsystem

    volumes:
      - ./backend:/app

volumes:
  postgres_data: